name: update-gex
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python gex_calc.py
        env:
          GEX_MODE: week
      - run: |
          git config user.name "gex-bot"
          git config user.email "gex-bot@users.noreply.github.com"
          git add data
          git commit -m "update $(date -u +%FT%TZ)" || exit 0
          git push
